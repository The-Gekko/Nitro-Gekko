<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icono de aplicacion de Nitro Gekko.

  No usa el logo ilustrado del proyecto a proposito: una ilustracion detallada
  se convierte en una mancha a 16 px, que es donde de verdad se ve un icono de
  aplicacion (barra de tareas, dock, resultados de busqueda). El logo vive en
  el README, donde si se aprecia.

  El icono dice lo que hace la app: un rotor de ventilador. Las cuatro aspas
  estan curvadas como colas de gecko, y el degradado cian -> magenta es el del
  neon del logo, para que se reconozca la familia sin depender del detalle.

  Lienzo 128x128 con margen de 8 px, segun la guia de iconos de GNOME.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0E7490"/>
      <stop offset="0.45" stop-color="#1E3A8A"/>
      <stop offset="1"    stop-color="#9D174D"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>

    <radialGradient id="brillo" cx="0.32" cy="0.24" r="0.85">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Una sola aspa. Se instancia cuatro veces girada 90 grados.
         El perfil es asimetrico (borde de ataque recto, borde de salida
         curvo) para que se lea como aspa y no como petalo. -->
    <g id="aspa">
      <path d="M64 64
               C 64 44, 72 30, 88 22
               C 96 34, 94 50, 82 60
               C 76 64, 70 65, 64 64 Z"/>
    </g>
  </defs>

  <!-- Fondo -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#fondo)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#brillo)"/>

  <!-- Anillo exterior: la carcasa del ventilador -->
  <circle cx="64" cy="64" r="41" fill="none" stroke="url(#neon)" stroke-width="3.5" opacity="0.75"/>

  <!-- Rotor -->
  <g fill="url(#neon)">
    <use href="#aspa"/>
    <use href="#aspa" transform="rotate(90 64 64)"/>
    <use href="#aspa" transform="rotate(180 64 64)"/>
    <use href="#aspa" transform="rotate(270 64 64)"/>
  </g>

  <!-- Buje central, con el ojo del gecko: pupila vertical -->
  <circle cx="64" cy="64" r="15" fill="#0B1220"/>
  <circle cx="64" cy="64" r="15" fill="none" stroke="url(#neon)" stroke-width="2.5"/>
  <ellipse cx="64" cy="64" rx="3.2" ry="9" fill="#86EFAC"/>
  <circle cx="60.5" cy="58.5" r="2.1" fill="#ffffff" opacity="0.9"/>
</svg>
