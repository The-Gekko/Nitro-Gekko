# DKMS para linuwu-sense parcheado para el Acer Nitro AN17-51.
#
# POR QUE DKMS Y NO UN .ko SUELTO
# --------------------------------
# El modulo se compila contra UNA version exacta de kernel: su vermagic hoy es
# "7.2.3-zen1-2-zen" y `insmod` lo rechaza contra cualquier otra. Sin DKMS, la
# primera actualizacion de linux-zen dejaria el portatil arrancando sin
# linuwu_sense y, con acer_wmi en la lista negra, sin perfiles termicos, sin
# tacometros y sin RGB. DKMS lo recompila solo en cada kernel nuevo.
#
# QUE LLEVA DE PARCHE RESPECTO AL UPSTREAM
# -----------------------------------------
#  1. quirk_acer_nitro_an17_51 (.nitro_v4=1, .four_zone_kb=1) + su entrada DMI.
#     Sin esto el AN17-51 no se detecta y el grupo four_zoned_kb no se crea.
#  2. Tres strncpy() -> memcpy(): en kernel 7.2 strncpy ya no esta declarado y
#     el upstream no compila. Es sustitucion directa porque en los tres sitios
#     len < sizeof(destino) y el NUL se escribe explicitamente a continuacion.

PACKAGE_NAME="linuwu-sense"

# LA VERSION NO PUEDE LLEVAR GUION.  Parece un detalle de estilo y deja el
# portatil sin ventiladores en el siguiente kernel.
#
# El hook de pacman (/usr/share/libalpm/scripts/dkms) NO lee este fichero: para
# saber que recompilar parte el nombre del directorio /usr/src/<nombre>-<version>
# con la expresion ([^/]+)-([^/]+), que es avida y por lo tanto corta por el
# ULTIMO guion del nombre.  Con PACKAGE_VERSION="1.0.0-an17.1" el directorio se
# llamaba linuwu-sense-1.0.0-an17.1 y el hook registraba el modulo como
# 'linuwu-sense-1.0.0/an17.1', que no es lo que dice este fichero: quedaban dos
# arboles DKMS en paralelo y el del hook fallaba en cada actualizacion de
# kernel.  Sin guion en la version el corte cae donde debe y el hook coincide
# con PACKAGE_NAME/PACKAGE_VERSION.
PACKAGE_VERSION="1.0.0.an17.1"

BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/updates"

# EL M= VA CON ${module}/${module_version}, NUNCA CON ${PACKAGE_NAME}/${PACKAGE_VERSION}.
#
# DKMS compila dentro de $dkms_tree/$module/$module_version/build, y esas dos
# variables son el nombre con el que el arbol se REGISTRO, que puede no ser el
# que pone aqui arriba (ver el aviso del guion).  Cuando no coinciden, el make
# apunta a un directorio que no existe y el error no orienta nada:
#     *** specified external module directory ".../build" does not exist.
# Son las mismas variables que usa el propio dkms cuando MAKE[0] no esta puesto
# (dkms 3.4.3, build_module()), asi que esto no inventa nada: lo copia.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${module}/${module_version}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${module}/${module_version}/build clean"

AUTOINSTALL="yes"
