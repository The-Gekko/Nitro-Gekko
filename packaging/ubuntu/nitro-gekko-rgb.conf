# Nitro Gekko (Ubuntu): linuwu_sense en lugar de acer_wmi.
#
# Los dos drivers reclaman los mismos GUID de WMI, asi que acer_wmi va a la
# lista negra: udev ya no lo carga por alias.
blacklist acer_wmi
#
# RED DE SEGURIDAD.  DKMS recompila linuwu_sense en cada kernel nuevo, pero
# hay dos casos en los que aun asi no carga: un kernel que rompe la
# compilacion, y Secure Boot con la clave MOK con la que DKMS firma el modulo
# todavia sin enrolar ("Key was rejected by service").  En los dos se carga
# acer_wmi, que con predator_v4=1 (/etc/modprobe.d/acer-wmi.conf) da perfiles
# y RPM.  Asi nunca se arranca sin perfiles termicos: lo peor es arrancar sin
# RGB.  NO quites esta linea: sin ella, cualquiera de esos dos casos arranca
# sin perfiles, sin RPM y sin RGB.
install linuwu_sense /usr/sbin/modprobe --ignore-install linuwu_sense $CMDLINE_OPTS || /usr/sbin/modprobe acer_wmi
#
# Que driver hay y para que kernels esta compilado:
#   lsmod | grep -E '^(linuwu_sense|acer_wmi) '
#   dkms status linuwu-sense
#   sudo dmesg | grep -i -E 'linuwu|key was rejected'
#   mokutil --sb-state
#
# Para volver a acer_wmi, desde el repositorio:
#   sudo ./packaging/instalar-rgb.sh --revertir
# A mano, sin el repositorio (perfiles y RPM vuelven al reiniciar; el RGB no):
#   sudo rm /etc/modprobe.d/nitro-gekko-rgb.conf /etc/modules-load.d/linuwu-sense.conf
#   echo 'options acer_wmi predator_v4=1' | sudo tee /etc/modprobe.d/acer-wmi.conf
