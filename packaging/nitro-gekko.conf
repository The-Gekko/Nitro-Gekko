# ============================================================================
#  Nitro Gekko - systemd-tmpfiles
#  Destino: /usr/lib/tmpfiles.d/nitro-gekko.conf
#
#  Da escritura al grupo 'wheel' sobre las rutas de sysfs del contrato.
#  Va acompanado de packaging/99-nitro-gekko.rules; los dos hacen falta y
#  cubren momentos distintos:
#
#    udev       reacciona a EVENTOS (aparece el dispositivo, se carga el
#               modulo, se recarga con 'udevadm trigger'). No sirve para
#               rutas que no cuelgan de ningun dispositivo.
#    tmpfiles   se ejecuta UNA VEZ AL ARRANQUE
#               (systemd-tmpfiles-setup.service) y cuando alguien lanza
#               'systemd-tmpfiles --create'. No ve eventos, pero llega a
#               cualquier ruta del sistema de ficheros.
#
#  Formato: Tipo  Ruta  Modo  Usuario  Grupo  Edad  Argumento
#
#  Se usa el tipo 'z' a proposito: ajusta modo/usuario/grupo de algo que YA
#  EXISTE y no intenta crearlo. En sysfs eso es justo lo que se quiere: si el
#  fichero no esta (modulo no cargado, otra maquina, otro kernel), la linea no
#  hace nada y no da error. Tipos como 'f' o 'd' intentarian crear y fallarian.
#
#  0664 root wheel = root escribe, el grupo wheel escribe, todo el mundo lee.
#  No se cambia el propietario (sigue siendo root) ni se toca el bit de otros.
# ============================================================================

# ---------------------------------------------------------------------------
#  PERFIL DE PLATAFORMA
#
#  Las dos rutas son la misma cosa vista por dos interfaces. La legacy de
#  /sys/firmware/acpi es la importante por dos motivos:
#    1) es la que notifica POLLPRI cuando el perfil cambia,
#    2) es la que vigila power-profiles-daemon con su GFileMonitor.
#  Y ademas es la unica que NO se puede resolver con udev: /sys/firmware no
#  es un dispositivo, no tiene subsistema ni emite uevents. Por eso esta linea
#  no es redundante con la regla udev: es la unica forma de abrirla.
# ---------------------------------------------------------------------------
z /sys/firmware/acpi/platform_profile                                 0664 root wheel - -

#  La interfaz nueva. La cubre tambien la regla udev (con ATTR{name}=="acer-wmi");
#  esto es la red de seguridad por si el evento se procesa antes de tiempo.
#  Se usa comodin porque el indice lo asigna el kernel; en esta maquina solo hay
#  un proveedor de perfiles (acer-wmi) y siempre es platform-profile-0.
z /sys/class/platform-profile/platform-profile-*/profile              0664 root wheel - -

# ---------------------------------------------------------------------------
#  PL1 (potencia sostenida). Solo constraint_0 (long_term).
#  constraint_1 (PL2 / short_term) y constraint_2 (peak_power) se dejan de
#  solo lectura a proposito.
#  energy_uj NO aparece aqui y no debe aparecer nunca: sigue 0400 root por la
#  mitigacion de PLATYPUS (CVE-2020-8694).
# ---------------------------------------------------------------------------
z /sys/class/powercap/intel-rapl:0/constraint_0_power_limit_uw        0664 root wheel - -
z /sys/class/powercap/intel-rapl-mmio:0/constraint_0_power_limit_uw   0664 root wheel - -

# ---------------------------------------------------------------------------
#  LIMITE DE CARGA DE BATERIA (0 = carga al 100%, 1 = limita al 80%)
#
#  Atributo de DRIVER del modulo DKMS acer-wmi-battery. Cuelga de
#  /sys/bus/wmi/drivers/..., que no es la ruta de ningun dispositivo, asi que
#  udev no puede alcanzarlo "por el dispositivo" y hay que nombrarlo a mano
#  tanto alli (con RUN+=) como aqui.
#
#  AVISO HONESTO SOBRE EL ORDEN DE ARRANQUE:
#  systemd-tmpfiles-setup.service corre muy pronto. Si acer_wmi_battery aun no
#  se ha cargado en ese momento, esta linea no encuentra el fichero y no hace
#  nada; quien salva la situacion entonces es la regla udev del evento de
#  modulo. Si aun asi el limite de carga apareciera como no disponible tras un
#  arranque, forzar la carga temprana del modulo lo arregla:
#      echo acer_wmi_battery | sudo tee /etc/modules-load.d/acer-wmi-battery.conf
# ---------------------------------------------------------------------------
z /sys/bus/wmi/drivers/acer-wmi-battery/health_mode                   0664 root wheel - -

# ---------------------------------------------------------------------------
#  TURBO (0 = turbo activo, 1 = desactivado)
#  Atributo global del driver intel_pstate. Cuelga de /sys/devices/system/cpu,
#  que no es un dispositivo udev con subsistema propio al que engancharse de
#  forma fiable, asi que se resuelve solo por aqui.
# ---------------------------------------------------------------------------
z /sys/devices/system/cpu/intel_pstate/no_turbo                       0664 root wheel - -
