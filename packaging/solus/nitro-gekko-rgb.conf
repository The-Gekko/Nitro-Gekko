# Nitro Gekko (Solus): linuwu_sense en lugar de acer_wmi.
#
# Los dos drivers reclaman los mismos GUID de WMI, asi que acer_wmi va a la
# lista negra: udev ya no lo carga por alias.
blacklist acer_wmi
#
# RED DE SEGURIDAD.  Solus no tiene DKMS: tras actualizar el kernel, el .ko de
# linuwu_sense no existe hasta que nitro-gekko-rgb-solus.service lo compila.
# Si linuwu_sense no carga (no compilado, o falla), se carga acer_wmi, que
# con predator_v4=1 (/etc/modprobe.d/acer-wmi.conf) da perfiles y RPM.  Asi
# nunca se arranca sin perfiles termicos.  NO quites esta linea: sin ella,
# un kernel nuevo arranca sin perfiles, sin RPM y sin RGB.
install linuwu_sense /usr/sbin/modprobe --ignore-install linuwu_sense $CMDLINE_OPTS || /usr/sbin/modprobe acer_wmi
#
# Que driver hay y para que kernels esta compilado:
#   /usr/lib/nitro-gekko-rgb/nitro-gekko-rgb-solus estado
#   journalctl -b -u nitro-gekko-rgb-solus
#
# Para volver a acer_wmi, desde el repositorio:
#   sudo ./packaging/instalar-rgb.sh --revertir
# A mano, sin el repositorio (perfiles y RPM vuelven al reiniciar; el RGB no):
#   sudo rm /etc/modprobe.d/nitro-gekko-rgb.conf /etc/modules-load.d/linuwu-sense.conf
#   echo 'options acer_wmi predator_v4=1' | sudo tee /etc/modprobe.d/acer-wmi.conf
#   sudo systemctl disable nitro-gekko-rgb-solus.service
